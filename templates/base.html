{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="{% static 'homepage/img/logo.png' %}"
           alt="Логотип системы управления релизами"
           class="release-logo">
      <div>
        <p class="brand-name">{{ site_name }}</p>
        <p class="brand-note">Django ORM · HTML по типам полей</p>
      </div>
    </div>
    {% include "includes/navigation.html" %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>
      {{ site_name }} ·
      <time id="current-year" datetime=""></time>
    </p>
  </footer>
  <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
