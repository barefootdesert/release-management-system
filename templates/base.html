{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Система управления релизами{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
  <header class="site-header border-bottom mb-4">
    <div class="container py-3 d-flex align-items-center gap-3">
      <img src="{% static 'homepage/img/logo.png' %}"
           alt="Логотип"
           class="release-logo">
      <div>
        <strong>Система управления релизами</strong>
        <div class="text-muted small">Django · шаблоны · SQLite</div>
      </div>
    </div>
    {% include "includes/navigation.html" %}
  </header>

  <main class="container pb-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer border-top mt-4">
    <div class="container py-3 text-muted small">
      Система управления релизами ·
      <span id="current-year"></span>
    </div>
  </footer>
  <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
