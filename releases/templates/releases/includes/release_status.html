{% if release.status == "cancelled" %}
  <span class="status status-cancelled">Отменён</span>
{% elif release.status == "completed" %}
  <span class="status status-published">Опубликован</span>
{% elif release.tests_passed and release.is_approved %}
  <span class="status status-ready">Запланирован · согласован</span>
{% else %}
  <span class="status status-wait">Запланирован</span>
{% endif %}
