{% if release.status == "cancelled" %}
  <span class="status status-cancelled" data-sql-type="TEXT">отменён</span>
{% elif release.status == "published" %}
  <span class="status status-published" data-sql-type="TEXT">опубликован</span>
{% elif release.tests_passed %}
  <span class="status status-ready" data-sql-type="TEXT">готов</span>
{% else %}
  <span class="status status-wait" data-sql-type="TEXT">
    {{ release.status|default:"ожидает" }}
  </span>
{% endif %}
