{% if release.status == "cancelled" %}
  <span class="status status-cancelled">отменён</span>
{% elif release.status == "published" %}
  <span class="status status-published">опубликован</span>
{% elif release.tests_passed %}
  <span class="status status-ready">готов</span>
{% else %}
  <span class="status status-wait">{{ release.status|default:"ожидает" }}</span>
{% endif %}
